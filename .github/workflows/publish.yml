name: Publish

# Manual publish stub. Publishing is intentionally deferred to a later phase:
# this workflow is a placeholder that only dry-runs the pack step so the
# release pipeline can be validated without publishing anything.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Dry-run pack
        run: npm pack --dry-run
      - name: Publish placeholder
        run: |
          echo "Publishing is not enabled yet."
          echo "When ready: configure NPM_TOKEN (or npm trusted publishing),"
          echo "remove 'private': true from package.json, and replace this"
          echo "step with 'npm publish --provenance --access public'."