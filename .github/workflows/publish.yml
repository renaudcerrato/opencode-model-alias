name: Publish

# Publishes the plugin to npm via Trusted Publishing (OIDC) — no NPM_TOKEN
# secret required. Requires a one-time setup on npmjs.com:
#   package settings → Trusted Publisher → GitHub Actions
#   repository: renaudcerrato/opencode-model-alias
#   workflow:   publish.yml
# Publishes a new package.json version when merged into main. Manual dispatch
# remains available for retrying a failed release.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check published versions
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          VERSIONS=$(npm view "$NAME" versions --json)
          STATUS=$(PUBLISHED_VERSIONS="$VERSIONS" TARGET_VERSION="$VERSION" node -e '
            const published = JSON.parse(process.env.PUBLISHED_VERSIONS)
            if (!Array.isArray(published) && typeof published !== "string") throw new Error("Unexpected npm versions response")
            const versions = Array.isArray(published) ? published : [published]
            process.stdout.write(versions.includes(process.env.TARGET_VERSION) ? "exists" : "new")
          ')
          if [ "$STATUS" = "exists" ]; then
            echo "$NAME@$VERSION is already published; skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish == 'true'
        run: npm ci
      - if: steps.version.outputs.publish == 'true'
        run: npm run typecheck
      - if: steps.version.outputs.publish == 'true'
        run: npm test
      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: npm publish --provenance --access public
