name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Single jest invocation per job. On Node 22 the text-summary report
      # is captured from the same run and appended to the job summary.
      - name: Run tests
        run: |
          npm test -- --coverage --coverageReporters=text --coverageReporters=text-summary | tee jest-output.txt
      - name: Coverage summary
        if: matrix.node-version == 22
        run: |
          echo "### Coverage" >> $GITHUB_STEP_SUMMARY
          grep -A6 "^Statements" jest-output.txt >> $GITHUB_STEP_SUMMARY || \
            echo "(coverage summary unavailable)" >> $GITHUB_STEP_SUMMARY